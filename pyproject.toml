[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dc3-model"
version = "0.1.0"
description = "Python implementation of the D-centred thermal comfort classification model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ojo Patrick Duke" }
]
keywords = [
  "thermal comfort",
  "DC3",
  "HVAC",
  "ASHRAE",
  "classification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.3",
  "joblib>=1.3",
]
viz = [
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "plotly>=5.18",
  "kaleido>=0.2.1",
]
live = [
  "sqlalchemy>=2.0",
]
docs = [
  "sphinx>=7.0",
  "pydata-sphinx-theme>=0.15",
  "sphinx-design>=0.6",
  "furo>=2024.1.29",
  "myst-parser>=2.0",
  "sphinx-copybutton>=0.5",
]
test = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]
publish = [
  "build>=1.2",
  "twine>=5.0",
]
dev = [
  "dc3-model[docs,live,ml,publish,test,viz]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dc3 = ["data/*.csv", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
